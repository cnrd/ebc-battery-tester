name: Publish native container platform

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
    outputs:
      digest:
        value: ${{ jobs.platform.outputs.digest }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cnrd/ebc-battery-tester

jobs:
  platform:
    # Keep the trust boundary even if another caller reuses this workflow.
    if: github.repository == 'cnrd/ebc-battery-tester' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify native runner architecture
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          case "$ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo 'Unsupported or non-native architecture' >&2; exit 1 ;;
          esac
      - name: Validate release again before publication
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash .github/scripts/validate-release.sh
      - name: Generate explicit image metadata policy
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          TAGS=$(node .github/scripts/container-tags.mjs tags "$GITHUB_REF" "$GITHUB_SHA")
          VERSION=$(node .github/scripts/container-tags.mjs version)
          {
            echo 'tags<<EOF'
            printf '%s\n' "$TAGS" | sed 's/^/type=raw,value=/'
            echo 'EOF'
            echo "version=$VERSION"
            # Both native builds receive identical logical metadata.
            echo "created=$(git show -s --format=%cI "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"
      - name: OCI metadata (no implicit latest)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ steps.policy.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/cnrd/ebc-battery-tester
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.policy.outputs.version }}
            org.opencontainers.image.created=${{ steps.policy.outputs.created }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Headless EBC Battery Tester server with remote browser UI
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push native platform image by digest only
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ inputs.arch }}
          build-args: TRUNK_VERSION=0.21.14
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub attests the combined index, not BuildKit pseudo-platforms.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=container-${{ inputs.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ inputs.arch }}
