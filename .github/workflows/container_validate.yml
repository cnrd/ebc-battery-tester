name: Validate production containers

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up arm64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build loadable production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: TRUNK_VERSION=0.21.14
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ebc-battery-tester:smoke-${{ matrix.arch }}
          cache-from: |
            type=gha,scope=container-${{ matrix.arch }}
            type=gha,scope=container-multiarch
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Smoke production runtime and persistent data
        run: bash .github/scripts/container-smoke.sh "ebc-battery-tester:smoke-${{ matrix.arch }}"
