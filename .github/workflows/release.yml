name: Release

env:
  TRUNK_VERSION: 0.21.14

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test container tag policy
        run: node --test .github/scripts/*.test.mjs
      - name: Validate release version and main ancestry
        run: bash .github/scripts/validate-release.sh

  docker-build:
    needs: validate
    uses: ./.github/workflows/container_validate.yml

  container-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'cnrd/ebc-battery-tester'
    needs: [validate, docker-build]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/container_publish.yml

  build-linux:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libudev-dev
      - name: Setup toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebc-battery-tester-linux
          path: target/release/ebc_battery_tester

  build-windows:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebc-battery-tester-windows
          path: target/release/ebc_battery_tester.exe

  build-wasm:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup set profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Download and install Trunk binary
        run: |
          curl --fail --location --silent --show-error \
            --output trunk.tar.gz \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf trunk.tar.gz trunk
      - name: Build
        run: EBC_WASM_DEFAULT_TRANSPORT=webusb ./trunk build --locked --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebc-battery-tester-wasm
          path: dist/

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-wasm, container-publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ebc-battery-tester-linux
          path: artifacts/linux
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ebc-battery-tester-windows
          path: artifacts/windows
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: ebc-battery-tester-wasm
          path: artifacts/wasm
      - name: Prepare release assets
        run: |
          mv artifacts/linux/ebc_battery_tester artifacts/ebc-battery-tester-linux
          mv artifacts/windows/ebc_battery_tester.exe artifacts/ebc-battery-tester-windows.exe
          cd artifacts/wasm && zip -r ../ebc-battery-tester-wasm.zip . && cd ../..
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PRERELEASE=()
          if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            artifacts/ebc-battery-tester-linux \
            artifacts/ebc-battery-tester-windows.exe \
            artifacts/ebc-battery-tester-wasm.zip \
            --title "Release $RELEASE_TAG" \
            --generate-notes "${PRERELEASE[@]}"
